}
function renderSingle(){const r=run,w=r.pool[r.index];if(!w){renderResult();return}
 const inListen=mode==='listen';const title=({practice:'Поставь ударение',fix:'Работа над ошибками',listen:'Слушай и выбирай',marathon:'Орфоэпический марафон'})[mode];
 const upper=mode==='marathon'?`Серия: ${r.right} · Рекорд: ${saved.best}`:`Слово ${r.index+1} из ${r.pool.length}`;
 let main='';
 if(inListen){main=`<p class="notice">⚠️ Озвучивание выполняет голос браузера. Он может ошибаться в ударениях. Учителю следует предварительно проверить произношение на своём устройстве.</p><div class="question"><div class="eyebrow">Прослушай слово, затем выбери верно поставленное ударение</div><div style="margin-top:22px"><button class="btn play" data-action="speak">🔊 Прослушать слово</button></div><div class="listen-opts">${vowelIndices(w).map(i=>`<button data-choice="${i}" ${r.answered?'disabled':''}>${esc(stress(w,i))}</button>`).join('')}</div></div>`}
 else{main=`<div class="question"><div class="eyebrow">${mode==='marathon'?'Ни одной ошибки!':mode==='fix'?'Два правильных ответа в разные попытки — слово выучено':'Нажми на гласную, на которую падает ударение'}</div>${letters(w,r.selected,{revealed:r.answered,disabled:r.answered})}</div>`}
 let result='';if(r.answered){const good=w.valid.includes(r.selected);result=`<div class="feedback ${good?'ok':'no'}">${good?'✓ Верно!':'✗ Ошибка.'} Правильное ударение: <b>${esc(correctStresses(w))}</b>${mode==='fix'&&good?(saved.mistakes[w.id]?' · Верно 1 из 2 раз, слово осталось на повторении.':' · Слово выучено и убрано из ошибок!'):''}</div>${mode==='marathon'?'':`<div class="actions"><button class="btn" data-action="next">${r.index===r.pool.length-1?'Посмотреть результат':'Следующее слово →'}</button></div>`}`}
 app.innerHTML=header(title,upper)+`<section class="surface">${mode==='marathon'?`<div class="timer" style="font-size:32px">🔥 ${r.right} подряд</div>`:progress(r.index,r.pool.length)}${main}${result}</section>`;
}
function answerSingle(idx){const r=run,w=r?.pool[r.index];if(!w||r.answered)return;
 const good=w.valid.includes(idx);r.answered=true;r.selected=idx;if(good)r.right++;else r.errors.push(w);record(w,good,mode==='fix');
 if(mode==='marathon'){
   if(!good){renderResult('marathonFail');return}
   saved.best=Math.max(saved.best,r.right);persist();r.index++;r.answered=false;r.selected=null;
   renderSingle();return;
 }
 renderSingle();}
function nextSingle(){if(!run?.answered)return;run.index++;run.answered=false;run.selected=null;renderSingle()}
function renderResult(reason='completed'){
 stopClocks();const r=run,mar=mode==='marathon';let score=mar?r.right:`${r.right}/${r.pool.length}`;
 let title=mar?(reason==='marathonFail'?'Марафон завершён':'Отличный марафон!'):'Тренировка завершена';
 let subtitle=mar?`Правильных ответов подряд: ${r.right}. Лучший результат: ${saved.best}.`:`Правильных ответов: ${r.right} из ${r.pool.length}.`;
 let mistakes=[...new Map(r.errors.map(w=>[w.id,w])).values()];
 const text=`Ударение · 4 класс\nРежим: ${mode}\nРезультат: ${score}\nОшибки: ${mistakes.map(correctStresses).join(', ')||'нет'}`;
 app.innerHTML=header('Результат')+`<div class="surface"><div class="big-score">${score}</div><div class="result-title">${title}</div><p class="result-sub">${subtitle}</p>${mistakes.length?`<h3 style="text-align:center">Повтори эти слова</h3><div class="review">${mistakes.map(w=>`<span class="wrong">${esc(correctStresses(w))}</span>`).join('')}</div>`:`<div class="review"><span class="good">✓ Ошибок нет!</span></div>`}<div class="actions"><button class="btn" data-action="again">Ещё раз</button><button class="btn secondary" data-action="copy-result">Скопировать результат</button><button class="btn secondary" data-action="menu">Все режимы</button></div></div>`;
 run.lastResultText=text;
}
function renderQuartetIntro(){mode='quartet';stopClocks();const tabs=[['all','Все три пачки',158],['1','Пачка № 1 · 4ЕГЭ',34],['2','Пачка № 2 · подготовка',42],['3','Пачка № 3 · прошедшие ВПР',82]];
 app.innerHTML=header('Случайная четвёрка','Исходные наборы из трёх файлов')+`<div class="surface"><p class="tip" style="font-size:15px">Здесь используются <b>именно исходные задания</b>: порядок слов внутри каждого варианта не меняется. В некоторых заданиях — пять слов, и все они сохраняются. Проверка происходит после ответа на все слова.</p><h3>Выбери пачку</h3><div class="pack-list">${tabs.map(([id,label,n])=>`<button class="pack-option ${String(quartetPack)===String(id)?'chosen':''}" data-pack="${id}"><b>${label}</b><span>${n} заданий</span></button>`).join('')}</div><div class="actions" style="margin-top:24px"><button class="btn" data-action="start-quartet">Получить случайный вариант →</button></div></div>`;
}
function newQuartet(){mode='quartet';stopClocks();const candidates=sourceSets.map((q,i)=>({...q,globalId:i})).filter(q=>quartetPack==='all'||String(q.pack)===String(quartetPack));
 const history=quartetSeen[quartetPack];let available=candidates.filter(q=>!history.includes(q.globalId));if(!available.length){quartetSeen[quartetPack]=[];available=candidates;}
 const current=available[Math.floor(Math.random()*available.length)];quartetSeen[quartetPack].push(current.globalId);
 const pool=current.items.map(item=>({...words[item.id],text:item.display,answerText:words[item.id].text,note:item.note||''}));
 run={type:'quartet',source:current,pool,choices:pool.map(()=>null),checked:false,right:0,errors:[]};renderQuartet();
}
function renderQuartet(){const r=run,total=r.pool.length,src=r.source;
 const names={1:'4ЕГЭ',2:'РЕШУ ВПР · подготовка',3:'РЕШУ ВПР · прошедшие ВПР'};
 const info=`Пачка № ${src.pack} · вариант ${src.number}${src.code?' · задание № '+src.code:''}`;
 app.innerHTML=header('Случайная четвёрка',info)+`<section class="surface"><p class="tip" style="font-size:15px"><b>Произнеси данные ниже слова, поставь в них знак ударения над ударными гласными.</b></p><p class="tiny muted" style="margin-top:-2px">Источник: ${names[src.pack]} · ${total} ${total===5?'слов':'слова'}.</p><div class="quartet ${total===5?'five-words':''}">${r.pool.map((w,n)=>{
 const choice=r.choices[n],good=w.valid.includes(choice),state=r.checked?(good?'ok':'no'):'';
 return `<div class="qcard ${state}"><div class="counter">Слово ${n+1}</div><div data-q="${n}">${letters(w,choice,{disabled:r.checked,revealed:r.checked})}</div>${w.note?`<div class="tip">${esc(w.note)}</div>`:''}${r.checked?`<div class="answer" style="color:${good?'#197949':'#b53750'}">${good?'Верно':'Правильно: '+esc(correctStresses(w))}</div>`:''}</div>`}).join('')}</div>${r.checked?`<div class="feedback ${r.right===total?'ok':'no'}" style="text-align:center">Результат: ${r.right} из ${total}. ${r.right===total?'Всё верно!':'Ошибок: '+(total-r.right)+'.'}</div>`:`<p class="tip" style="text-align:center">Отметь ударную гласную в каждом слове. Проверка доступна только после ответов на все ${total} ${total===5?'слов':'слова'}.</p>`}<div class="actions">${!r.checked?`<button class="btn" data-action="check-quartet" ${r.choices.some(x=>x===null)?'disabled':''}>Проверить ${total} ${total===5?'слов':'слова'}</button>`:''}<button class="btn secondary" data-action="new-quartet">Новый вариант</button><button class="btn secondary" data-action="quartet-options">Выбрать другую пачку</button></div></section>`;
}
function chooseQuartet(q,idx){if(!run||run.checked)return;run.choices[q]=idx;renderQuartet()}
function checkQuartet(){const r=run;if(r.checked||r.choices.some(x=>x===null))return;r.checked=true;
 r.pool.forEach((w,i)=>{let good=w.valid.includes(r.choices[i]);if(good)r.right++;else r.errors.push(w);record(w,good)});renderQuartet()}

function renderTeamsIntro(){mode='teams';app.innerHTML=header('Битва команд','Один экран · два игрока')+`<div class="surface"><p class="tip" style="font-size:16px">Команды отвечают одновременно. У каждой — своё слово. После ответа сразу появляется следующее. За правильный ответ — 1 балл; за неверный — 0.</p><div class="team-starter"><input id="name0" maxlength="25" value="Команда 1" aria-label="Название первой команды"><input id="name1" maxlength="25" value="Команда 2" aria-label="Название второй команды"></div><div class="field" style="justify-content:center;margin:20px 0"><strong>Время:</strong>${[60,90,120].map(n=>`<button class="chip ${teamSeconds===n?'active':''}" data-seconds="${n}">${n} сек.</button>`).join('')}</div><div class="actions"><button class="btn" data-action="start-teams">Начать битву 🏆</button></div></div>`}
function startTeams(){let names=[$('#name0')?.value||'Команда 1',$('#name1')?.value||'Команда 2'];mode='teams';run={type:'teams',score:[0,0],mistake:[0,0],seen:[0,0],names,pool:shuffle(words),current:[null,null],endAt:performance.now()+teamSeconds*1000,over:false};run.current=[teamWord(),teamWord()];renderTeams();timerHandle=setInterval(tickTeams,150)}
function teamWord(){if(!run.pool.length)run.pool=shuffle(words);return run.pool.pop()}
function renderTeam(i){const r=run,w=r.current[i],container=$('#team'+i);if(!container)return;container.innerHTML=`<div class="team-name">${esc(r.names[i])}</div><div class="team-score" id="score${i}">${r.score[i]}</div><div class="team-sub">Правильных ответов</div><div class="team-word" data-team="${i}">${letters(w)}</div><div class="team-sub">Нажми на ударную гласную</div>`}
function renderTeams(){const r=run;app.innerHTML=header('Битва команд','Игра идёт')+`<div class="surface"><div class="timer" id="teamTimer">${teamSeconds} сек.</div><div class="teams"><div id="team0" class="team blue"></div><div id="team1" class="team orange"></div></div><p class="tip" style="text-align:center;margin-top:19px">Каждой команде показываются разные слова. Игра не останавливается после ответа.</p><div class="actions"><button class="btn secondary" data-action="end-teams">Завершить игру</button></div></div>`;renderTeam(0);renderTeam(1)}
function answerTeam(i,idx){const r=run;if(!r||r.over)return;const w=r.current[i],good=w.valid.includes(idx);r.seen[i]++;if(good)r.score[i]++;else r.mistake[i]++;record(w,good);r.current[i]=teamWord();renderTeam(i)}
function tickTeams(){if(!run||run.over)return;let left=Math.max(0,Math.ceil((run.endAt-performance.now())/1000));if($('#teamTimer'))$('#teamTimer').textContent=`${left} сек.`;if(left<=0)endTeams()}
function endTeams(){const r=run;if(!r||r.over)return;r.over=true;stopClocks();let [a,b]=r.score;const win=a===b?'Ничья!':`Победила команда «${esc(r.names[a>b?0:1])}»!`;
 app.innerHTML=header('Битва команд — результат')+`<div class="surface"><h2 style="text-align:center">${win}</h2><div class="teams"><div class="team blue"><div class="team-name">${esc(r.names[0])}</div><div class="big-score">${a}</div><div class="team-sub">Ошибок: ${r.mistake[0]}</div></div><div class="team orange"><div class="team-name">${esc(r.names[1])}</div><div class="big-score">${b}</div><div class="team-sub">Ошибок: ${r.mistake[1]}</div></div></div><p class="tip" style="text-align:center;margin:18px 0">Каждый правильный ответ — один балл. Неправильный ответ не даёт баллов.</p><div class="actions"><button class="btn" data-action="again">Сыграть ещё раз</button><button class="btn secondary" data-action="menu">Все режимы</button></div></div>`}
function speak(){if(!('speechSynthesis' in window)){alert('На этом устройстве озвучивание не поддерживается. Попробуйте Chrome или другой браузер с русским голосом.');return}const w=run?.pool[run.index];if(!w)return;
 try{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(w.text);utterance.lang='ru-RU';utterance.rate=.82;utterance.pitch=1;
 const voices=speechSynthesis.getVoices(),ru=voices.find(v=>/^ru([-_]|$)/i.test(v.lang));if(ru)utterance.voice=ru;
 speechSynthesis.speak(utterance)}catch(e){alert('Не удалось озвучить слово в этом браузере.')}}
async function copyText(s){try{await navigator.clipboard.writeText(s);alert('Скопировано.')}catch(e){const area=document.createElement('textarea');area.value=s;document.body.append(area);area.select();document.execCommand('copy');area.remove();alert('Скопировано.')}}
function action(a){if(a==='menu'){renderMenu();return}
 if(a==='next'){nextSingle();return}
 if(a==='check-quartet'){checkQuartet();return}
 if(a==='new-quartet'||a==='start-quartet'){newQuartet();return}
 if(a==='quartet-options'){renderQuartetIntro();return}
 if(a==='speak'){speak();return}
 if(a==='start-teams'){startTeams();return}
 if(a==='end-teams'){endTeams();return}
 if(a==='copy-dictionary'){copyText(words.map(w=>correctStresses(w)).join(', '));return}
 if(a==='copy-result'&&run?.lastResultText){copyText(run.lastResultText);return}
 if(a==='again'){if(mode==='quartet')newQuartet();else if(mode==='teams')renderTeamsIntro();else begin(mode);return}
 if(a==='clear-progress'){if(confirm('Удалить результаты и все сохранённые ошибки на этом устройстве?')){saved=structuredClone(EMPTY);persist();renderMenu()}}
}
app.addEventListener('click',e=>{
 const element=e.target.closest('button');if(!element||element.disabled)return;
 if(element.dataset.mode){begin(element.dataset.mode);return}
 if(element.dataset.pack!==undefined){quartetPack=element.dataset.pack;renderQuartetIntro();return}
 if(element.dataset.seconds){teamSeconds=Number(element.dataset.seconds);document.querySelectorAll('[data-seconds]').forEach(el=>el.classList.toggle('active',Number(el.dataset.seconds)===teamSeconds));return}
 if(element.dataset.action){action(element.dataset.action);return}
 if(element.dataset.choice!==undefined){answerSingle(Number(element.dataset.choice));return}
 if(element.dataset.letter!==undefined){const idx=Number(element.dataset.letter);
 if(mode==='quartet'){const q=element.closest('[data-q]');if(q)chooseQuartet(Number(q.dataset.q),idx)}
 else if(mode==='teams'){const team=element.closest('[data-team]');if(team)answerTeam(Number(team.dataset.team),idx)}
 else if(['practice','fix','marathon'].includes(mode)){answerSingle(idx)}
 }
});
app.addEventListener('change',e=>{if(e.target.id==='totalWords')countSetting=e.target.value;if(e.target.id==='teamSec')teamSeconds=+e.target.value});
window.addEventListener('pagehide',stopClocks);
renderMenu();
</script>
</body>
</html>
